name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes during hour 0, and hours 6 through 23.
    # It pauses entirely for hours 1, 2, 3, 4, and 5.
    - cron: '*/14 0,6-23 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: curl -s https://silicogen.onrender.com/ > /dev/null
